services:
  db:
    image: postgres:16
    container_name: admission_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend/SchoolAdmission.Api
    container_name: admission_backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=postgres;Password=postgres"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080"
    container_name: admission_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: